# Model Architecture
model:
  vocab_size: 384  # 6 special + DSL constants (ZERO-NINE for colors) + verifier tokens
  d_model: 256
  n_head: 8
  num_layers: 1
  num_recursions: 8
  dropout: 0.1

# Training Schedule
training:
  epochs: 10
  batch_size: 4
  lr: 1e-4
  device: "auto"
  use_torch_compile: false  # torch.compile for 20-40% speedup (disable on Mac)

# Dataset
dataset:
  diff_lb: 0.0  # Difficulty lower bound
  diff_ub: 0.5  # Difficulty upper bound

# Validation & Execution
validation:
  interval_epochs: 1      # Run validation every N epochs
  num_examples: 8        # Total examples to generate, execute & score for validation
  max_gen_len: 256       # Maximum tokens to generate per example

# Checkpointing
checkpoint:
  save_dir: "checkpoints"
  save_every_n_epochs: 10
  keep_best: true

# Logging
wandb:
  enabled: true
  project: "arc-neuro-dsl"