# Model Architecture
model:
  vocab_size: 400
  d_model: 256
  n_head: 8
  num_recursions: 8
  dropout: 0.1

# Training Schedule
training:
  epochs: 10
  batch_size: 8
  lr: 2.5e-5
  device: "auto"

# Validation & Execution
validation:
  interval_epochs: 1      # Run validation every N epochs
  num_examples: 400        # Total examples to generate, execute & score for validation

# Checkpointing
checkpoint:
  save_dir: "checkpoints"
  save_every_n_epochs: 10
  keep_best: true

# Logging
wandb:
  enabled: true 
  project: "arc-neuro-dsl"