# Model Architecture
model:
  vocab_size: 384  # Updated to match tokenizer with [NEWLINE]
  d_model: 512
  n_head: 8
  num_recursions: 16
  dropout: 0.1

# Training Schedule
training:
  epochs: 1000
  batch_size: 64
  lr: 1.0e-4
  device: "auto"

# Dataset
dataset:
  diff_lb: 0.0  # Difficulty lower bound
  diff_ub: 0.5  # Difficulty upper bound

# Validation & Execution
validation:
  interval_epochs: 25      # Run validation every N epochs
  num_examples: 400        # Total examples to generate, execute & score for validation
  max_gen_len: 2048         # Maximum tokens to generate per example

# Checkpointing
checkpoint:
  save_dir: "checkpoints"
  save_every_n_epochs: 250
  keep_best: true

# Logging
wandb:
  enabled: true 
  project: "arc-neuro-dsl"