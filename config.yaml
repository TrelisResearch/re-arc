# Model Architecture
model:
  vocab_size: 400
  d_model: 512
  n_head: 8
  num_recursions: 16
  dropout: 0.1

# Training Schedule
training:
  epochs: 10000
  batch_size: 64
  lr: 1.0e-4
  device: "auto"

# Validation & Execution
validation:
  interval_epochs: 200      # Run validation every N epochs
  num_examples: 400        # Total examples to generate, execute & score for validation

# Checkpointing
checkpoint:
  save_dir: "checkpoints"
  save_every_n_epochs: 500
  keep_best: true

# Logging
wandb:
  enabled: true 
  project: "arc-neuro-dsl"