# Model Architecture
model:
  vocab_size: 384  # 6 special + DSL constants (ZERO-NINE for colors) + verifier tokens
  d_model: 256
  n_head: 8
  num_layers: 1        # Number of decoder layers (GPT-style decoder-only)
  num_recursions: 16     # Number of times to recursively apply the decoder stack
  dropout: 0.1

# Training Schedule
training:
  epochs: 10000
  batch_size: 32
  gradient_accumulation_steps: 4  # Effective batch = batch_size * gradient_accumulation_steps
  lr: 1.0e-4
  device: "auto"
  use_torch_compile: true  # torch.compile for 20-40% speedup

# Dataset
dataset:
  diff_lb: 0.0  # Difficulty lower bound
  diff_ub: 1  # Difficulty upper bound

# Validation & Execution
validation:
  interval_epochs: 500      # Run validation every N epochs
  num_examples: 64        # Total examples to generate, execute & score for validation
  max_gen_len: 2048         # Maximum tokens to generate per example

# Checkpointing
checkpoint:
  save_dir: "checkpoints"
  save_every_n_epochs: 250
  keep_best: true

# Logging
wandb:
  enabled: true 
  project: "arc-neuro-dsl"