# Model Architecture
model:
  vocab_size: 400 # Approximate, tokenizer will override
  d_model: 512
  n_head: 8
  num_recursions: 8
  dropout: 0.1

# Training Schedule
training:
  epochs: 100
  epoch_size: 1000
  batch_size: 32
  lr: 1.0e-4
  device: "auto" # "auto", "cuda", "mps", "cpu"

# Validation & Execution
validation:
  interval_epochs: 5      # Run validation every N epochs
  num_execution_examples: 16 # How many generated programs to execute and score per check
  limit_val_batches: 4     # How many batches to run for standard val loss/token_acc

# Checkpointing
checkpoint:
  save_dir: "checkpoints"
  save_every_n_epochs: 10
  keep_best: true

# Logging
wandb:
  enabled: false # Can be overridden by CLI --use_wandb
  project: "arc-neuro-dsl"
